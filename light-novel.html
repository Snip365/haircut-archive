<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Light Novel</title>

<link rel="stylesheet" href="style.css">
<script src="scroll-top.js"></script>

</head>

<body>

<h1>Light Novel</h1>

<div id="lista"></div>

<script src="ln-dados.js"></script>

<script>

const lista = document.getElementById("lista");

const obras = Object.keys(dados).sort((a, b) => {

    const aLatino = /^[A-Za-z]/.test(a.trim());
    const bLatino = /^[A-Za-z]/.test(b.trim());

    // Coloca os nomes com A-Z antes dos demais
    if (aLatino && !bLatino) {
        return -1;
    }

    if (!aLatino && bLatino) {
        return 1;
    }

    return a.localeCompare(b);

});

let categoriaAtual = "";

obras.forEach(obra => {

    const primeiroCaractere = obra.trim().charAt(0);

    let categoria;

    if (/^[A-Za-z]$/.test(primeiroCaractere)) {
        categoria = primeiroCaractere.toUpperCase();
    } else {
        categoria = "OUTROS IDIOMAS";
    }

    if (categoria !== categoriaAtual) {

        categoriaAtual = categoria;

        const titulo = document.createElement("h2");
        titulo.textContent = categoria;

        lista.appendChild(titulo);

    }

    const link = document.createElement("a");

    link.href =
        "ln-obra.html?nome=" +
        encodeURIComponent(obra);

    link.textContent = obra;

    // Salva a posição da rolagem
    link.addEventListener("click", function () {
        localStorage.setItem("posicao_ln", window.scrollY);
    });

    lista.appendChild(link);

    lista.appendChild(
        document.createElement("br")
    );

});

// Restaura a posição da rolagem
window.addEventListener("load", function () {

    const posicao = localStorage.getItem("posicao_ln");

    if (posicao !== null) {

        setTimeout(function () {
            window.scrollTo(0, parseInt(posicao, 10));
        }, 50);

    }

});

</script>

</body>

</html>
