<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Recently Added</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="page-controls">

    <a
        href="#"
        class="nav-button"
        id="back-button"
    >
        Back
    </a>


    <a
        href="index.html"
        class="nav-button"
    >
        Homepage
    </a>


    <button
        id="theme-toggle"
        type="button"
    >
        Dark Mode
    </button>

</div>


<div class="page-header">

    <h1>
        Recently Added
    </h1>

</div>


<div id="recentes"></div>


<script src="scroll-top.js"></script>

<script src="back-navigation.js"></script>

<script src="theme.js"></script>


<script>


// ============================================================
// MAIN ELEMENT
// ============================================================


const recentes =
    document.getElementById(
        "recentes"
    );


// ============================================================
// ALL ITEMS
// ============================================================


let todosItens = [];


// ============================================================
// LOAD JAVASCRIPT DATA FILE
// ============================================================


async function carregarDados(url) {


    const resposta =
        await fetch(url);


    if (!resposta.ok) {


        throw new Error(

            `Could not load ${url}`

        );

    }


    const texto =
        await resposta.text();


    const executar =
        new Function(`

            ${texto}

            return dados;

        `);


    return executar();

}


// ============================================================
// ADD ITEMS TO THE MAIN ARRAY
// ============================================================


function adicionarItens(

    banco,

    categoria,

    pastaImagens,

    paginaObra

) {


    Object.keys(banco).forEach(

        obra => {


            banco[obra].forEach(

                item => {


                    todosItens.push({

                        personagem:

                            item.personagem ||

                            item.obra ||

                            "",


                        info:

                            item.info ||

                            "",


                        arquivo:

                            item.arquivo,


                        data_adicao:

                            item.data_adicao ||

                            "1970-01-01",


                        obra:

                            obra,


                        categoria:

                            categoria,


                        pastaImagens:

                            pastaImagens,


                        paginaObra:

                            paginaObra

                    });


                }

            );


        }

    );

}


// ============================================================
// FORMAT MONTH AND YEAR
// ============================================================


function formatarMes(

    data

) {


    const meses = [

        "January",

        "February",

        "March",

        "April",

        "May",

        "June",

        "July",

        "August",

        "September",

        "October",

        "November",

        "December"

    ];


    const dataObj =
        new Date(data);


    if (

        isNaN(

            dataObj.getTime()

        )

    ) {


        return "Unknown Date";

    }


    return (

        `${meses[dataObj.getMonth()]} ` +

        `${dataObj.getFullYear()}`

    );

}


// ============================================================
// LOAD ALL CATEGORIES
// ============================================================


async function carregarTodos() {


    const [

        manga,

        anime,

        lightNovel

    ] = await Promise.all([


        carregarDados(

            "dados.js"

        ),


        carregarDados(

            "anime-dados.js"

        ),


        carregarDados(

            "ln-dados.js"

        )

    ]);


    adicionarItens(

        manga,

        "Manga",

        "imagens",

        "obra.html"

    );


    adicionarItens(

        anime,

        "Anime",

        "imagens_anime",

        "anime-obra.html"

    );


    adicionarItens(

        lightNovel,

        "Light Novel",

        "imagens_ln",

        "ln-obra.html"

    );


    // ========================================================
    // SORT BY DATE AND TIME
    // MOST RECENT FIRST
    // ========================================================


    todosItens.sort(

        (

            a,

            b

        ) => {


            const timeA =

                Date.parse(

                    a.data_adicao

                );


            const timeB =

                Date.parse(

                    b.data_adicao

                );


            // Invalid dates go to the end


            if (

                isNaN(timeA)

            ) {


                return 1;

            }


            if (

                isNaN(timeB)

            ) {


                return -1;

            }


            return (

                timeB -

                timeA

            );

        }

    );


    // ========================================================
    // GROUP ITEMS BY YEAR AND MONTH
    // ========================================================


    const grupos = {};


    todosItens.forEach(

        item => {


            const data =
                new Date(

                    item.data_adicao

                );


            // Ignore invalid dates


            if (

                isNaN(

                    data.getTime()

                )

            ) {


                return;

            }


            const ano =
                data.getFullYear();


            const mes =
                String(

                    data.getMonth() + 1

                ).padStart(

                    2,

                    "0"

                );


            const chave =

                `${ano}-${mes}`;


            if (

                !grupos[chave]

            ) {


                grupos[chave] = [];

            }


            grupos[chave].push(

                item

            );

        }

    );


    // ========================================================
    // RENDER MONTH GROUPS
    // NEWEST MONTH FIRST
    // ========================================================


    Object.keys(grupos)

        .sort()

        .reverse()

        .forEach(

            chave => {


                const [

                    ano,

                    mes

                ] = chave.split(

                    "-"

                );


                const meses = [

                    "January",

                    "February",

                    "March",

                    "April",

                    "May",

                    "June",

                    "July",

                    "August",

                    "September",

                    "October",

                    "November",

                    "December"

                ];


                const tituloMes =

                    document.createElement(

                        "h2"

                    );


                tituloMes.textContent =

                    `${

                        meses[

                            Number(mes) - 1

                        ]

                    } ${ano}`;


                recentes.appendChild(

                    tituloMes

                );


                const lista =

                    document.createElement(

                        "div"

                    );


                lista.className =

                    "recentes-lista";


                // ====================================================
                // ITEMS INSIDE THIS MONTH
                // ====================================================


                grupos[chave].forEach(

                    item => {


                        const bloco =

                            document.createElement(

                                "div"

                            );


                        bloco.className =

                            "recent-item";


                        const link =

                            document.createElement(

                                "a"

                            );


                        link.href =

                            `${

                                item.paginaObra

                            }?nome=${

                                encodeURIComponent(

                                    item.obra

                                )

                            }`;


                        link.className =

                            "recent-link";


                        const imagem =

                            document.createElement(

                                "img"

                            );


                        imagem.src =

                            `${

                                item.pastaImagens

                            }/${

                                item.arquivo

                            }`;


                        imagem.loading =

                            "lazy";


                        imagem.decoding =

                            "async";


                        // ====================================================
                        // IMAGE ERROR HANDLING
                        // ====================================================


                        imagem.onerror =

                            function() {


                                console.warn(

                                    "Image could not be loaded:",

                                    imagem.src

                                );


                            };


                        const texto =

                            document.createElement(

                                "div"

                            );


                        texto.className =

                            "recent-text";


                        const personagem =

                            document.createElement(

                                "b"

                            );


                        personagem.textContent =

                            item.personagem;


                        const obra =

                            document.createElement(

                                "div"

                            );


                        obra.textContent =

                            item.obra;


                        const info =

                            document.createElement(

                                "div"

                            );


                        info.textContent =

                            item.info;


                        const categoria =

                            document.createElement(

                                "small"

                            );


                        categoria.textContent =

                            item.categoria;


                        texto.appendChild(

                            personagem

                        );


                        texto.appendChild(

                            obra

                        );


                        texto.appendChild(

                            info

                        );


                        texto.appendChild(

                            categoria

                        );


                        link.appendChild(

                            imagem

                        );


                        link.appendChild(

                            texto

                        );


                        bloco.appendChild(

                            link

                        );


                        lista.appendChild(

                            bloco

                        );


                    }

                );


                recentes.appendChild(

                    lista

                );


            }

        );

}


// ============================================================
// START
// ============================================================


carregarTodos()

    .catch(

        erro => {


            console.error(

                "Could not load recently added items:",

                erro

            );


            recentes.innerHTML =

                '<p class="empty-state">' +

                'Unable to load recently added items.' +

                '</p>';

        }

    );


</script>


</body>

</html>
