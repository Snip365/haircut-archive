<div class="page-controls">
    <a href="#" class="nav-button" id="back-button">Back</a>

    <a href="index.html" class="nav-button">
        Homepage
    </a>

    <button
        id="theme-toggle"
        type="button"
    >
        Dark Mode
    </button>
</div>


<div class="page-header">

    <h1>
        Recently Added
    </h1>

</div>


<div id="recentes"></div>


<script src="scroll-top.js"></script>
<script src="back-navigation.js"></script>
<script src="theme.js"></script>


<script>


// ============================================================
// CONFIGURATION
// ============================================================

// Only files created from this date onward are shown.

const DATA_MINIMA =
    "2026-01-01T00:00:00";


// ============================================================
// MAIN CONTAINER
// ============================================================

const recentes =
    document.getElementById(
        "recentes"
    );


// ============================================================
// DATA COLLECTION
// ============================================================

let todosItens = [];


// ============================================================
// LOAD JAVASCRIPT DATA FILE
// ============================================================

async function carregarDados(url) {


    const resposta =
        await fetch(url);


    if (!resposta.ok) {

        throw new Error(
            `Could not load ${url}`
        );

    }


    const texto =
        await resposta.text();


    const executar =
        new Function(

            texto +

            "\nreturn dados;"

        );


    return executar();

}


// ============================================================
// ADD ITEMS TO THE TEMPORARY LIST
// ============================================================

function adicionarItens(

    banco,

    categoria,

    pastaImagens,

    paginaObra

) {


    Object.keys(banco).forEach(

        obra => {


            banco[obra].forEach(

                item => {


                    // ------------------------------------------------
                    // If there is no creation date, ignore the item.
                    // ------------------------------------------------

                    if (

                        !item.data_criacao

                    ) {

                        return;

                    }


                    const dataCriacao =
                        new Date(

                            item.data_criacao

                        );


                    // ------------------------------------------------
                    // Ignore invalid dates.
                    // ------------------------------------------------

                    if (

                        Number.isNaN(

                            dataCriacao.getTime()

                        )

                    ) {

                        return;

                    }


                    // ------------------------------------------------
                    // Only keep files created from 2026-01-01 onward.
                    // ------------------------------------------------

                    const dataMinima =
                        new Date(

                            DATA_MINIMA

                        );


                    if (

                        dataCriacao <

                        dataMinima

                    ) {

                        return;

                    }


                    // ------------------------------------------------
                    // Store only the information necessary
                    // for Recently Added.
                    // ------------------------------------------------

                    todosItens.push({

                        personagem:
                            item.personagem ||

                            item.obra ||

                            "",


                        info:
                            item.info ||

                            "",


                        arquivo:
                            item.arquivo,


                        data_criacao:
                            item.data_criacao,


                        obra:
                            obra,


                        categoria:
                            categoria,


                        pastaImagens:
                            pastaImagens,


                        paginaObra:
                            paginaObra

                    });


                }

            );


        }

    );

}


// ============================================================
// FORMAT MONTH AND YEAR
// ============================================================

function formatarMes(

    data

) {


    const meses = [

        "January",

        "February",

        "March",

        "April",

        "May",

        "June",

        "July",

        "August",

        "September",

        "October",

        "November",

        "December"

    ];


    const dataObj =
        new Date(

            data

        );


    return (

        meses[dataObj.getMonth()] +

        " " +

        dataObj.getFullYear()

    );

}


// ============================================================
// LOAD ALL DATA
// ============================================================

async function carregarTodos() {


    const [

        manga,

        anime,

        lightNovel

    ] = await Promise.all([

        carregarDados(

            "dados.js"

        ),

        carregarDados(

            "anime-dados.js"

        ),

        carregarDados(

            "ln-dados.js"

        )

    ]);


    // --------------------------------------------------------
    // Manga
    // --------------------------------------------------------

    adicionarItens(

        manga,

        "Manga",

        "imagens",

        "obra.html"

    );


    // --------------------------------------------------------
    // Anime
    // --------------------------------------------------------

    adicionarItens(

        anime,

        "Anime",

        "imagens_anime",

        "anime-obra.html"

    );


    // --------------------------------------------------------
    // Light Novel
    // --------------------------------------------------------

    adicionarItens(

        lightNovel,

        "Light Novel",

        "imagens_ln",

        "ln-obra.html"

    );


    // ========================================================
    // SORT NEWEST FIRST
    // ========================================================

    todosItens.sort(

        (a, b) => {


            return (

                new Date(

                    b.data_criacao

                ).getTime()

                -

                new Date(

                    a.data_criacao

                ).getTime()

            );

        }

    );


    // ========================================================
    // GROUP BY MONTH AND YEAR
    // ========================================================

    const grupos = {};


    todosItens.forEach(

        item => {


            const grupo =
                formatarMes(

                    item.data_criacao

                );


            if (

                !grupos[grupo]

            ) {

                grupos[grupo] = [];

            }


            grupos[grupo].push(

                item

            );

        }

    );


    // ========================================================
    // RENDER RESULTS
    // ========================================================

    Object.keys(

        grupos

    ).forEach(

        grupo => {


            const tituloMes =
                document.createElement(

                    "h2"

                );


            tituloMes.textContent =
                grupo;


            recentes.appendChild(

                tituloMes

            );


            const lista =
                document.createElement(

                    "div"

                );


            lista.className =
                "recentes-lista";


            grupos[grupo].forEach(

                item => {


                    const bloco =
                        document.createElement(

                            "div"

                        );


                    bloco.className =
                        "recent-item";


                    const link =
                        document.createElement(

                            "a"

                        );


                    link.href =

                        item.paginaObra +

                        "?nome=" +

                        encodeURIComponent(

                            item.obra

                        );


                    link.className =
                        "recent-link";


                    const imagem =
                        document.createElement(

                            "img"

                        );


                    imagem.src =

                        item.pastaImagens +

                        "/" +

                        item.arquivo;


                    imagem.loading =
                        "lazy";


                    imagem.decoding =
                        "async";


                    const texto =
                        document.createElement(

                            "div"

                        );


                    texto.className =
                        "recent-text";


                    const personagem =
                        document.createElement(

                            "b"

                        );


                    personagem.textContent =
                        item.personagem;


                    const obra =
                        document.createElement(

                            "div"

                        );


                    obra.textContent =
                        item.obra;


                    const info =
                        document.createElement(

                            "div"

                        );


                    info.textContent =
                        item.info;


                    const categoria =
                        document.createElement(

                            "small"

                        );


                    categoria.textContent =
                        item.categoria;


                    texto.appendChild(

                        personagem

                    );


                    texto.appendChild(

                        obra

                    );


                    texto.appendChild(

                        info

                    );


                    texto.appendChild(

                        categoria

                    );


                    link.appendChild(

                        imagem

                    );


                    link.appendChild(

                        texto

                    );


                    bloco.appendChild(

                        link

                    );


                    lista.appendChild(

                        bloco

                    );


                }

            );


            recentes.appendChild(

                lista

            );


        }

    );


    // ========================================================
    // EMPTY RESULT
    // ========================================================

    if (

        todosItens.length === 0

    ) {


        recentes.innerHTML =

            "<p class='empty-state'>" +

            "No images created from January 1, 2026 onward." +

            "</p>";

    }

}


// ============================================================
// START
// ============================================================

carregarTodos().catch(

    erro => {


        console.error(

            "Could not load Recently Added:",

            erro

        );


        recentes.innerHTML =

            "<p class='empty-state'>" +

            "Unable to load recently added items." +

            "</p>";

    }

);

</script>
