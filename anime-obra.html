<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Obra</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

    <img src="assets/banner.webp" alt="Manga Haircut Archive banner" class="hero-banner">

    <div class="page-controls">
        <a href="anime.html" class="nav-button">Back</a>
        <a href="index.html" class="nav-button">Homepage</a>
        <button id="theme-toggle" type="button">Dark Mode</button>
    </div>

    <h1 id="titulo"></h1>


<div id="galeria"></div>



<script src="anime-dados.js"></script>
<script src="theme.js"></script>


<script>


const parametros = new URLSearchParams(
    window.location.search
);


const nomeObra = parametros.get("nome");


const titulo = document.getElementById("titulo");

const galeria = document.getElementById("galeria");



titulo.textContent = nomeObra;



const imagens = dados[nomeObra];



if (!imagens) {


    galeria.innerHTML =
    "<p>Obra não encontrada.</p>";


}

else {


    imagens.forEach(item => {


        const bloco = document.createElement("div");

        bloco.className = "item";


        const imagem = document.createElement("img");


        imagem.src =
        "imagens_anime/" + item.arquivo;


        imagem.loading = "lazy";
	imagem.decoding = "async";

        const texto = document.createElement("p");


        texto.innerHTML =
        "<b>" + item.personagem + "</b><br>" +
        item.info;



        bloco.appendChild(imagem);

        bloco.appendChild(texto);


        galeria.appendChild(bloco);


    });


}



</script>


</body>

</html>
