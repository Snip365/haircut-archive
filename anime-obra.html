<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Obra</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

    <img src="assets/banner.webp" alt="Manga Haircut Archive banner" class="hero-banner">

    <div class="page-controls">
        <a href="#" class="nav-button" id="back-button">Back</a>
        <a href="index.html" class="nav-button">Homepage</a>
        <button id="theme-toggle" type="button">Dark Mode</button>
    </div>

    <h1 id="titulo"></h1>


<div id="galeria"></div>

<div id="obra-nav-container"></div>



<script src="anime-dados.js"></script>
    <script src="scroll-top.js"></script>
    <script src="back-navigation.js"></script>
    <script src="theme.js"></script>


<script>


const parametros = new URLSearchParams(
    window.location.search
);


const nomeObra = parametros.get("nome");


const titulo = document.getElementById("titulo");

const galeria = document.getElementById("galeria");

const navContainer = document.getElementById("obra-nav-container");



titulo.textContent = nomeObra;



const imagens = dados[nomeObra];



if (!imagens) {


    galeria.innerHTML =
    "<p>Obra não encontrada.</p>";


}

else {


    imagens.forEach(item => {


        const bloco = document.createElement("div");

        bloco.className = "item";


        const imagem = document.createElement("img");


        imagem.src =
        "imagens_anime/" + encodeURIComponent(item.arquivo);


        imagem.loading = "lazy";
	imagem.decoding = "async";

        const texto = document.createElement("p");


        texto.innerHTML =
        "<b>" + item.personagem + "</b><br>" +
        item.info;



        bloco.appendChild(imagem);

        bloco.appendChild(texto);


        galeria.appendChild(bloco);


    });

    // ========================================================
    // BUILD NAVIGATION
    // ========================================================

    const todasAsObras = Object.keys(dados).sort((a, b) => {
        const aLatino = /^[A-Za-z]/.test(a.trim());
        const bLatino = /^[A-Za-z]/.test(b.trim());

        if (aLatino && !bLatino) {
            return -1;
        }

        if (!aLatino && bLatino) {
            return 1;
        }

        return a.localeCompare(b);
    });

    const posicaoAtual = todasAsObras.indexOf(nomeObra);

    const temAnterior = posicaoAtual > 0;
    const temProxima = posicaoAtual < todasAsObras.length - 1;

    const obraAnterior = temAnterior ? todasAsObras[posicaoAtual - 1] : null;
    const obraProxima = temProxima ? todasAsObras[posicaoAtual + 1] : null;

    // Create navigation container
    const navDiv = document.createElement("div");
    navDiv.className = "obra-navigation";

    // Previous button
    const btnAnterior = document.createElement("a");
    btnAnterior.className = "nav-button";
    btnAnterior.textContent = "← Previous";

    if (temAnterior) {
        btnAnterior.href = "anime-obra.html?nome=" + encodeURIComponent(obraAnterior);
    } else {
        btnAnterior.disabled = true;
    }

    // Next button
    const btnProxima = document.createElement("a");
    btnProxima.className = "nav-button";
    btnProxima.textContent = "Next →";

    if (temProxima) {
        btnProxima.href = "anime-obra.html?nome=" + encodeURIComponent(obraProxima);
    } else {
        btnProxima.disabled = true;
    }

    navDiv.appendChild(btnAnterior);
    navDiv.appendChild(btnProxima);
    navContainer.appendChild(navDiv);


}



</script>


</body>

</html>
