<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img src="assets/banner.webp" alt="Manga Haircut Archive banner" class="hero-banner">

    <div class="page-controls">
        <a href="#" class="nav-button" id="back-button">Back</a>
        <a href="index.html" class="nav-button">Homepage</a>
        <button id="theme-toggle" type="button">Dark Mode</button>
    </div>

    <h1>Anime</h1>

    <div id="lista"></div>

    <script src="anime-dados.js"></script>
    <script src="scroll-top.js"></script>
    <script src="back-navigation.js"></script>
    <script src="theme.js"></script>

    <script>

        const lista = document.getElementById("lista");

        const obras = Object.keys(dados).sort((a, b) => {

            const aLatino = /^[A-Za-z]/.test(a.trim());
            const bLatino = /^[A-Za-z]/.test(b.trim());

            if (aLatino && !bLatino) return -1;
            if (!aLatino && bLatino) return 1;

            return a.localeCompare(b);

        });

        let categoriaAtual = "";

        obras.forEach(obra => {

            const primeiroCaractere = obra.trim().charAt(0);

            let categoria;

            if (/^[A-Za-z]$/.test(primeiroCaractere)) {
                categoria = primeiroCaractere.toUpperCase();
            } else {
                categoria = "OTHER LANGUAGES";
            }

            if (categoria !== categoriaAtual) {

                categoriaAtual = categoria;

                const titulo = document.createElement("h2");
                titulo.textContent = categoria;
                lista.appendChild(titulo);

            }

            const link = document.createElement("a");

            link.href =
                "anime-obra.html?nome=" +
                encodeURIComponent(obra);

            link.textContent = obra;

            lista.appendChild(link);
            lista.appendChild(document.createElement("br"));

        });

    </script>

</body>

</html>
