<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Mangá</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<h1>Mangá</h1>

<div id="lista"></div>


<script src="dados.js"></script>


<script>

const lista = document.getElementById("lista");


const obras = Object.keys(dados).sort((a, b) => {

    const aLatino = /^[A-Za-z]/.test(a.trim());

    const bLatino = /^[A-Za-z]/.test(b.trim());


    // Coloca os nomes com A-Z antes dos demais
    if (aLatino && !bLatino) {
        return -1;
    }


    if (!aLatino && bLatino) {
        return 1;
    }


    return a.localeCompare(b);

});


let categoriaAtual = "";

// Salva a posição da lista antes de abrir uma obra
window.addEventListener("beforeunload", function () {

    localStorage.setItem(
        "posicao_manga",
        window.scrollY
    );

});

obras.forEach(obra => {


    const primeiroCaractere =
        obra.trim().charAt(0);


    let categoria;


    if (
        /^[A-Za-z]$/.test(primeiroCaractere)
    ) {

        categoria =
            primeiroCaractere.toUpperCase();

    }

    else {

        categoria =
            "OUTROS IDIOMAS";

    }


    if (categoria !== categoriaAtual) {


        categoriaAtual = categoria;


        const titulo =
            document.createElement("h2");


        titulo.textContent =
            categoria;


        lista.appendChild(titulo);

    }


    const link =
        document.createElement("a");


    link.href =
        "obra.html?nome=" +
        encodeURIComponent(obra);


    link.textContent =
        obra;


    lista.appendChild(link);


    lista.appendChild(
        document.createElement("br")
    );


});

// Restaura a posição anterior da lista
window.addEventListener("load", function () {

    const posicao =
        localStorage.getItem("posicao_manga");

    if (posicao !== null) {

        window.scrollTo(
            0,
            parseInt(posicao)
        );

    }

});

</script>

</body>

</html>
